<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planning · Outreach Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Roboto:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="shell.js?v=4.1"></script>
<script src="dr.js"></script>
<link rel="stylesheet" href="planning.css?v=3">
</head><body>
<div class="shell">
  <nav class="sb" id="sb" aria-label="Views"></nav>
  <main class="pl" id="main">
    <header class="pl-head">
      <div><p class="eyebrow">Planning · internal only</p><h1 id="title">Planning</h1></div>
      <span class="muted mono" id="copied"></span>
    </header>
    <div class="banner" id="banner" hidden></div>

    <section class="card board-card" aria-labelledby="mmH">
      <div class="card-h"><h2 id="mmH">Market map</h2>
        <div class="legend" aria-label="Colour key"><span><i class="dot green"></i>Direct competitor · pitch first</span><span><i class="dot yellow"></i>Adjacent · pitch next</span><span><i class="dot red"></i>Don't pitch</span><span><i class="ring"></i>We are here</span></div>
        <div class="acts"><button class="btn ghost" id="mmEdit" aria-pressed="false">Edit</button><button class="btn" id="mmSave" hidden>Save</button></div>
      </div>
      <p class="muted small" id="mmMeta"></p>
      <div class="board">
        <div class="b-tree"><div id="tree"></div><div id="nodeEd"></div></div>
        <div class="b-col"><h3>Authoritative non-PR sources</h3><div id="nonpr"></div></div>
        <div class="b-col"><h3>PR</h3><div id="pr"></div></div>
        <div class="b-src"><h3>Sources</h3><div id="sources"></div></div>
        <div class="b-rf"><div class="rf-h"><h3>Refill by day</h3><span class="muted small" id="rfMeta"></span></div><div class="tbl-wrap" id="refill"></div></div>
      </div>
    </section>

    <section class="card" aria-labelledby="drH">
      <div class="card-h"><h2 id="drH">Domain Rating growth</h2><div class="acts"><button class="btn ghost" id="drTbl" aria-pressed="false">Table</button></div></div>
      <div id="dr"></div>
    </section>

  </main>
</div>
<script src="planning.js?v=3"></script>
</body></html>
